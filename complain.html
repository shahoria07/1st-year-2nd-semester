<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anonymous Complain Box</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .complain-box {
      background: rgba(30, 30, 30, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 25px;
      max-width: 500px;
      margin: 30px auto;
      color: white;
    }
    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }
    .input-group label {
      display: block;
      margin-bottom: 5px;
      color: #dee94b;
    }
    .input-group input, .input-group select, .input-group textarea {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #555;
      background: #111;
      color: white;
      box-sizing: border-box;
    }
    .btn {
      background: #d90429;
      color: white;
      font-weight: bold;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
    }
    .btn:hover {
      background: #ff002b;
    }
    .note {
      font-size: 12px;
      color: #aaa;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="complain-box">
      <h2 style="color: #dee94b; text-align: center;">📥 Student Complain Box</h2>
      <p style="text-align: center; font-size: 14px;">আপনার কোনো সমস্যা বা খারাপ অভিজ্ঞতার কথা গোপনে আমাদের জানান।</p>

      <!-- Web3Forms সার্ভিস ব্যবহার করে সরাসরি আপনার ইমেইলে অভিযোগ চলে যাবে -->
      <form action="https://api.web3forms.com/submit" method="POST">
        
        <!-- আপনার Web3Forms Access Key এখানে বসাবেন -->
        <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE">

        <div class="input-group">
          <label>অভিযোগ কার বিরুদ্ধে?</label>
          <select name="complain_against" required>
            <option value="">বাছাই করুন...</option>
            <option value="Teacher/Sir">শিক্ষক / স্যার (Teacher)</option>
            <option value="Employee/Staff">কর্মচারী / স্টাফ (Employee)</option>
            <option value="Student">অন্যান্য শিক্ষার্থী (Student)</option>
            <option value="Other">অন্যান্য (Other)</option>
          </select>
        </div>

        <div class="input-group">
          <label>অভিযোগের বিবরণ (বিস্তারিত লিখুন):</label>
          <textarea name="message" rows="5" required placeholder="কী ঘটেছিল এবং কেন খারাপ লেগেছে বিস্তারিত লিখুন..."></textarea>
        </div>

        <div class="input-group">
          <label>আপনার নাম ও রোল (ঐচ্ছিক/Optional):</label>
          <input type="text" name="student_info" placeholder="গোপন রাখতে চাইলে এটি খালি রাখুন">
        </div>

        <button type="submit" class="btn">Submit Complain</button>
        <p class="note">🔒 আপনার পরিচয় এবং তথ্য সম্পূর্ণ গোপন রাখা হবে।</p>
      </form>

      <div style="text-align: center; margin-top: 15px;">
        <a href="./index.html" style="color: #ffcc00; text-decoration: none;">🏠 Back to Home</a>
      </div>
    </div>
  </div>

</body>
</html>
