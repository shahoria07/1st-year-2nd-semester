<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NexZchat Community</title>
  <link rel="icon" href="favicon.png" type="image/png">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body, html {
      height: 100dvh;
      width: 100vw;
      background-color: #0b141a;
      color: #e9edef;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* PREMIUM HEADER */
    .chat-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 65px;
      background: #111b21;
      border-bottom: 1px solid #222d34;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 150px;
      height: auto;
    }

    .call-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      position: relative;
    }

    .header-btn {
      background: #202c33;
      border: 1px solid rgba(0, 168, 132, 0.4);
      color: #00a884;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease-in-out;
    }

    .header-btn:hover {
      background: #00a884;
      color: white;
      transform: scale(1.05);
      border-color: #00a884;
    }

    .my-header-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #00a884;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .my-header-avatar:hover {
      transform: scale(1.05);
    }

    /* 3 LINE DROPDOWN MENU */
    .menu-dropdown {
      position: absolute;
      top: 50px;
      right: 0;
      background: #233138;
      border: 1px solid #2a3942;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      display: none;
      flex-direction: column;
      width: 210px;
      z-index: 2000;
      overflow: hidden;
      padding: 6px 0;
      animation: fadeIn 0.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .menu-dropdown button, .menu-dropdown a {
      padding: 11px 16px;
      color: #e9edef;
      background: none;
      border: none;
      text-align: left;
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      transition: background 0.2s;
    }

    .menu-dropdown button:hover, .menu-dropdown a:hover {
      background: #182229;
      color: #00a884;
    }

    .menu-divider {
      height: 1px;
      background: #2a3942;
      margin: 4px 0;
    }

    /* CHAT BODY */
    .chat-body {
      flex: 1;
      margin-top: 65px;
      margin-bottom: 70px;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background-image: radial-gradient(#1f2c34 1.2px, transparent 1.2px);
      background-size: 18px 18px;
      -webkit-overflow-scrolling: touch;
    }

    /* MESSAGE BUBBLE */
    .msg-wrapper {
      display: flex;
      gap: 10px;
      max-width: 82%;
    }

    .msg-wrapper.received {
      align-self: flex-start;
    }

    .msg-wrapper.sent {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      margin-top: 2px;
      border: 1px solid #222d34;
    }

    .message {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.45;
      word-wrap: break-word;
      position: relative;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .received .message {
      background: #202c33;
      border-top-left-radius: 2px;
      color: #e9edef;
    }

    .sent .message {
      background: #005c4b;
      border-top-right-radius: 2px;
      color: #e9edef;
    }

    .sender-name {
      font-size: 11px;
      font-weight: 700;
      color: #00a884;
      margin-bottom: 4px;
      display: block;
    }

    .sent .sender-name {
      color: #53bdeb;
      text-align: right;
    }

    .chat-img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 6px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .chat-file-link {
      color: #dee94b;
      text-decoration: underline;
      display: inline-block;
      margin-top: 4px;
      font-weight: 600;
    }

    /* FOOTER CONTROL */
    .chat-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      min-height: 65px;
      background: #111b21;
      border-top: 1px solid #222d34;
      display: flex;
      align-items: center;
      padding: 8px 12px;
      padding-bottom: calc(8px + env(safe-area-inset-bottom));
      gap: 6px;
      z-index: 1000;
    }

    .attach-btn {
      background: none;
      border: none;
      color: #8696a0;
      font-size: 19px;
      cursor: pointer;
      padding: 6px;
      flex-shrink: 0;
      transition: color 0.2s;
    }

    .attach-btn:hover {
      color: #00a884;
    }

    .chat-input {
      flex: 1;
      min-width: 0;
      background: #2a3942;
      border: none;
      outline: none;
      color: #fff;
      padding: 11px 16px;
      border-radius: 22px;
      font-size: 14px;
    }

    .send-btn {
      background: #00a884;
      border: none;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .send-btn:hover {
      background: #008f6f;
    }

    input[type="file"] {
      display: none;
    }

    /* PROFILE MODAL POPUP */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 3000;
    }

    .modal-box {
      background: #111b21;
      border: 1px solid #222d34;
      padding: 24px;
      border-radius: 16px;
      width: 90%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }

    .modal-box h3 {
      margin-bottom: 15px;
      color: #00a884;
      font-size: 18px;
    }

    .modal-avatar-preview {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 12px;
      border: 3px solid #00a884;
    }

    .modal-input {
      width: 100%;
      padding: 12px;
      background: #2a3942;
      border: none;
      color: #fff;
      border-radius: 8px;
      margin-bottom: 15px;
      outline: none;
      font-size: 14px;
    }

    .modal-save-btn {
      width: 100%;
      padding: 12px;
      background: #00a884;
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- PROFILE MODAL FOR FIRST TIME VISITORS -->
  <div class="modal-overlay" id="profileModal">
    <div class="modal-box">
      <h3>Setup NexZchat Profile</h3>
      <img id="modalAvatarPreview" src="https://api.dicebear.com/7.x/bottts/svg?seed=user" class="modal-avatar-preview">
      <br>
      <label for="profileImgInput" style="color: #53bdeb; cursor: pointer; font-size: 13px; font-weight: 500;">Change Profile Picture</label>
      <input type="file" id="profileImgInput" accept="image/*" onchange="previewProfilePic(this)">
      
      <input type="text" id="userNameInput" class="modal-input" placeholder="Enter your name..." style="margin-top: 15px;">
      <button class="modal-save-btn" onclick="saveProfile()">Start Chatting</button>
    </div>
  </div>

  <!-- TOP HEADER -->
  <header class="chat-header">
    <div class="header-left">
      <img id="myHeaderPic" src="https://api.dicebear.com/7.x/bottts/svg?seed=user" class="my-header-avatar" onclick="openProfileModal()" title="Edit Profile">
      
      <!-- NexZchat BRAND LOGO -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" class="brand-logo">
        <defs>
          <linearGradient id="nexzGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00A884" />
            <stop offset="100%" stop-color="#00F2FE" />
          </linearGradient>
          <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="100%" stop-color="#DEE94B" />
          </linearGradient>
        </defs>
        <g transform="translate(10, 10)">
          <circle cx="50" cy="50" r="42" fill="none" stroke="url(#nexzGradient)" stroke-width="4" stroke-dasharray="180 60" transform="rotate(-45 50 50)"/>
          <path d="M 25 35 C 25 20, 75 20, 75 35 C 75 50, 55 50, 45 60 C 42 62, 38 65, 32 68 C 35 60, 25 52, 25 35 Z" fill="url(#nexzGradient)" />
          <circle cx="40" cy="36" r="4" fill="#0B141A" />
          <circle cx="50" cy="36" r="4" fill="#0B141A" />
          <circle cx="60" cy="36" r="4" fill="#0B141A" />
          <circle cx="85" cy="20" r="6" fill="#DEE94B" />
        </g>
        <text x="125" y="68" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="42" fill="url(#textGrad)">NexZ<tspan fill="#00A884">chat</tspan></text>
        <text x="128" y="90" font-family="'Segoe UI', sans-serif" font-weight="500" font-size="12" fill="#94A3B8" letter-spacing="3">CONNECT THE WORLD</text>
      </svg>
    </div>

    <div class="call-actions">
      <button class="header-btn" onclick="startVoiceCall()" title="Voice Call">📞</button>
      <button class="header-btn" onclick="startVideoCall()" title="Video Call">📹</button>
      
      <!-- 3 LINE / 3 DOT MENU BUTTON -->
      <button class="header-btn" onclick="toggleOptionsMenu(event)" title="More Options">⋮</button>

      <!-- DROPDOWN OPTIONS LIST -->
      <div class="menu-dropdown" id="optionsMenu">
        <a href="./index.html">🏠 Home</a>
        <button onclick="openProfileModal()">👤 Edit Profile</button>
        <button onclick="createGroup()">👥 New Group</button>
        <button onclick="viewMedia()">🖼️ Media & Files</button>
        <button onclick="clearChat()">🗑️ Clear Chat</button>
        <div class="menu-divider"></div>
        <button onclick="toggleTheme()">🌙 Switch Theme</button>
        <button onclick="openSettings()">⚙️ Settings</button>
        <div class="menu-divider"></div>
        <button onclick="appInfo()">ℹ️ About NexZchat</button>
      </div>
    </div>
  </header>

  <!-- CHAT MESSAGES CONTAINER -->
  <main class="chat-body" id="chatContainer" onclick="closeOptionsMenu()"></main>

  <!-- BOTTOM INPUT BAR -->
  <footer class="chat-footer">
    <label for="imageInput" class="attach-btn" title="Send Image">📷</label>
    <input type="file" id="imageInput" accept="image/*" onchange="sendImage(this)">

    <label for="pdfInput" class="attach-btn" title="Send PDF / File">📄</label>
    <input type="file" id="pdfInput" accept="application/pdf" onchange="sendPDF(this)">

    <button class="attach-btn" id="recordBtn" onclick="toggleVoiceRecord()" title="Record Audio">🎤</button>
    <button class="attach-btn" onclick="requestUserLocation()" title="Share Location">📍</button>

    <input type="text" id="messageInput" class="chat-input" placeholder="Type a message..." autocomplete="off">
    <button class="send-btn" onclick="sendMessage()">➤</button>
  </footer>

  <!-- FIREBASE MODULE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAsA-3A0pd8Vn6u4MbZr56uF80MBst7fTA",
      authDomain: "chatverse-5905d.firebaseapp.com",
      databaseURL: "https://chatverse-5905d-default-rtdb.firebaseio.com",
      projectId: "chatverse-5905d",
      storageBucket: "chatverse-5905d.firebasestorage.app",
      messagingSenderId: "692B37148565",
      appId: "1:592037148565:web:b4cee7044d055591ea89c",
      measurementId: "G-VXVCV8R5JP"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const messagesRef = ref(db, "messages");

    let myUserId = localStorage.getItem("nexZchatUserId");
    if (!myUserId) {
      myUserId = "user_" + Math.random().toString(36).substring(2, 9);
      localStorage.setItem("nexZchatUserId", myUserId);
    }

    let myName = localStorage.getItem("nexZchatUserName") || "";
    let myPic = localStorage.getItem("nexZchatUserPic") || `https://api.dicebear.com/7.x/bottts/svg?seed=${myUserId}`;

    const chatContainer = document.getElementById("chatContainer");

    if (!myName) {
      document.getElementById("profileModal").style.display = "flex";
    } else {
      document.getElementById("profileModal").style.display = "none";
      document.getElementById("myHeaderPic").src = myPic;
    }

    /* DROPDOWN MENU HANDLERS */
    window.toggleOptionsMenu = function(event) {
      event.stopPropagation();
      const menu = document.getElementById("optionsMenu");
      menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
    }

    window.closeOptionsMenu = function() {
      document.getElementById("optionsMenu").style.display = "none";
    }

    window.createGroup = function() {
      closeOptionsMenu();
      alert("👥 Group Chat feature is coming soon!");
    }

    window.viewMedia = function() {
      closeOptionsMenu();
      alert("🖼️ Shared Media & Files gallery opening...");
    }

    window.clearChat = function() {
      closeOptionsMenu();
      if(confirm("Are you sure you want to clear your local view?")) {
        chatContainer.innerHTML = "";
      }
    }

    window.toggleTheme = function() {
      closeOptionsMenu();
      alert("🌙 Theme toggled!");
    }

    window.openSettings = function() {
      closeOptionsMenu();
      alert("⚙️ Settings opened!");
    }

    window.appInfo = function() {
      closeOptionsMenu();
      alert("ℹ️ NexZchat v2.0 - Powered by STZ IT COM");
    }

    /* PROFILE HANDLERS */
    window.saveProfile = function() {
      const nameInput = document.getElementById("userNameInput").value.trim();
      if (nameInput) {
        myName = nameInput;
        localStorage.setItem("nexZchatUserName", myName);
        localStorage.setItem("nexZchatUserPic", myPic);
        document.getElementById("myHeaderPic").src = myPic;
        document.getElementById("profileModal").style.display = "none";
      } else {
        alert("Please enter your name!");
      }
    }

    window.openProfileModal = function() {
      closeOptionsMenu();
      document.getElementById("userNameInput").value = myName;
      document.getElementById("profileModal").style.display = "flex";
    }

    window.previewProfilePic = function(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          myPic = e.target.result;
          document.getElementById("modalAvatarPreview").src = myPic;
        }
        reader.readAsDataURL(input.files[0]);
      }
    }

    /* MESSAGING SYSTEM */
    window.sendMessage = function() {
      const input = document.getElementById("messageInput");
      const text = input.value.trim();

      if (text !== "") {
        push(messagesRef, {
          senderId: myUserId,
          senderName: myName,
          senderPic: myPic,
          content: text,
          timestamp: Date.now()
        });
        input.value = "";
      }
    }

    onChildAdded(messagesRef, (snapshot) => {
      const data = snapshot.val();
      const messageType = data.senderId === myUserId ? "sent" : "received";
      appendMessage(data, messageType);
    });

    window.sendImage = function(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const imgHTML = `📷 <b>Image:</b><br><img src="${e.target.result}" class="chat-img" />`;
          push(messagesRef, { senderId: myUserId, senderName: myName, senderPic: myPic, content: imgHTML, timestamp: Date.now() });
        }
        reader.readAsDataURL(input.files[0]);
      }
    }

    window.sendPDF = function(input) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        const fileURL = URL.createObjectURL(file);
        const pdfHTML = `📄 <b>File:</b> ${file.name}<br><a href="${fileURL}" target="_blank" class="chat-file-link">📥 View / Download PDF</a>`;
        push(messagesRef, { senderId: myUserId, senderName: myName, senderPic: myPic, content: pdfHTML, timestamp: Date.now() });
      }
    }

    let isRecording = false;
    window.toggleVoiceRecord = function() {
      const recBtn = document.getElementById("recordBtn");
      if (!isRecording) {
        isRecording = true;
        recBtn.style.color = "#ff4b4b";
        alert("🎤 Recording Started... Click again to stop and send.");
      } else {
        isRecording = false;
        recBtn.style.color = "#8696a0";
        push(messagesRef, { senderId: myUserId, senderName: myName, senderPic: myPic, content: "🎙️ <i>Voice Note (0:05)</i>", timestamp: Date.now() });
      }
    }

    window.requestUserLocation = function() {
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const mapUrl = `https://www.google.com/maps?q=${lat},${lng}`;
            const locHTML = `📍 <b>Live Location:</b><br><a href="${mapUrl}" target="_blank" class="chat-file-link">🗺️ Open in Google Maps</a>`;
            push(messagesRef, { senderId: myUserId, senderName: myName, senderPic: myPic, content: locHTML, timestamp: Date.now() });
          },
          () => alert("Location access denied or unavailable.")
        );
      }
    }

    window.startVoiceCall = () => alert("📞 Voice Call initiated!");
    window.startVideoCall = () => alert("📹 Video Call initiated!");

    function appendMessage(data, type) {
      const wrapper = document.createElement("div");
      wrapper.className = `msg-wrapper ${type}`;

      const nameHTML = `<span class="sender-name">${data.senderName || 'Anonymous'}</span>`;
      const avatarHTML = `<img src="${data.senderPic || 'https://api.dicebear.com/7.x/bottts/svg?seed=user'}" class="msg-avatar" title="${data.senderName}">`;

      wrapper.innerHTML = `
        ${avatarHTML}
        <div class="message">
          ${nameHTML}
          ${data.content}
        </div>
      `;

      chatContainer.appendChild(wrapper);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    document.getElementById("messageInput").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
