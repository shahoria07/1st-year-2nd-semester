<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Chat Room</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Firebase SDK Modules -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // স্ক্রিনশট থেকে সংগৃহীত আপনার আসল Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyC7NIqxJfzFcI88KBJZ1j8aiqeDOmZPcY",
      authDomain: "our-chat-25a46.firebaseapp.com",
      databaseURL: "https://our-chat-25a46-default-rtdb.firebaseio.com",
      projectId: "our-chat-25a46",
      storageBucket: "our-chat-25a46.firebasestorage.app",
      messagingSenderId: "947765671445",
      appId: "1:947765671445:web:1023862cb43225a697881c",
      measurementId: "G-M854FQ44TZ"
    };

    // Firebase ইনিশিয়ালাইজেশন
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const messagesRef = ref(db, 'chat_messages');

    // মেসেজ পাঠানোর লজিক
    window.sendMessage = function() {
      const msgInput = document.getElementById('messageInput');
      const text = msgInput.value.trim();

      const savedProfile = JSON.parse(localStorage.getItem('studentProfile'));
      const senderName = savedProfile && savedProfile.name ? savedProfile.name : 'Student';

      if (text !== "") {
        push(messagesRef, {
          sender: senderName,
          message: text,
          timestamp: Date.now(),
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        }).then(() => {
          msgInput.value = "";
        }).catch((err) => {
          alert("Error: " + err.message);
        });
      }
    };

    // রিয়েল-টাইমে মেসেজ গ্রহণ
    onChildAdded(messagesRef, (snapshot) => {
      const data = snapshot.val();
      const chatContainer = document.getElementById('chatContainer');

      const savedProfile = JSON.parse(localStorage.getItem('studentProfile'));
      const myName = savedProfile && savedProfile.name ? savedProfile.name : 'Student';

      const isMe = data.sender === myName;
      const msgHTML = `
        <div class="msg-card ${isMe ? 'my-msg' : 'other-msg'}">
          <small class="sender-name">${data.sender}</small>
          <div class="msg-bubble">${data.message}</div>
          <span class="msg-time">${data.time}</span>
        </div>
      `;

      chatContainer.innerHTML += msgHTML;
      chatContainer.scrollTop = chatContainer.scrollHeight;
    });
  </script>

  <style>
    .chat-box {
      background: rgba(20, 20, 20, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      width: 90%;
      max-width: 550px;
      margin: 20px auto;
      display: flex;
      flex-direction: column;
      height: 80vh;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    .chat-header {
      background: #1e293b;
      padding: 15px;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      text-align: center;
      color: #dee94b;
      font-weight: bold;
    }
    .chat-messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg-card {
      display: flex;
      flex-direction: column;
      max-width: 75%;
    }
    .my-msg {
      align-self: flex-end;
      align-items: flex-end;
    }
    .other-msg {
      align-self: flex-start;
      align-items: flex-start;
    }
    .sender-name {
      font-size: 11px;
      color: #aaa;
      margin-bottom: 2px;
    }
    .msg-bubble {
      padding: 10px 14px;
      border-radius: 15px;
      font-size: 14px;
      word-break: break-word;
    }
    .my-msg .msg-bubble {
      background: #dee94b;
      color: black;
      border-bottom-right-radius: 2px;
    }
    .other-msg .msg-bubble {
      background: #2f302f;
      color: white;
      border-bottom-left-radius: 2px;
    }
    .msg-time {
      font-size: 9px;
      color: #777;
      margin-top: 2px;
    }
    .chat-input-area {
      padding: 10px;
      background: #111;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
      display: flex;
      gap: 8px;
    }
    .chat-input-area input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: white;
    }
    .chat-input-area button {
      background: #dee94b;
      color: black;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Hamburger Menu -->
  <div class="hamburger-dropdown">
    <button class="hamburger-btn" onclick="toggleMenu(event)">☰</button>
    <div class="dropdown-content" id="myDropdown">
      <a href="./index.html">🏠 Home</a>
      <a href="./NOTICE.html" target="_blank">📢 Notice</a>
      <a href="./HELP-LINE.html" target="_blank">☎️ Helpline</a>
      <a href="./profile.html">👤 My Profile</a>
      <a href="./chat.html">💬 Chat Room</a>
      <a href="./complain.html">📥 Complain Box</a>
      <a href="./feedback.html">💬 Feedback</a>
      <a href="./about.html">ℹ️ About Us</a>
    </div>
  </div>

  <div class="main-container">
    <div class="chat-box">
      <div class="chat-header">
        💬 Student Community Chat
      </div>

      <div class="chat-messages" id="chatContainer">
        <!-- মেসেজ প্রদর্শিত হবে -->
      </div>

      <div class="chat-input-area">
        <input type="text" id="messageInput" placeholder="মেসেজ লিখুন..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>

    <div style="text-align: center; margin-bottom: 15px;">
      <a href="./index.html" style="color: #ffcc00; text-decoration: none;">🏠 Back to Home</a>
    </div>
  </div>

  <script>
    function toggleMenu(event) {
      event.stopPropagation();
      const dropdown = document.getElementById("myDropdown");
      dropdown.classList.toggle("show-menu");
    }

    window.onclick = function(event) {
      const dropdown = document.getElementById("myDropdown");
      if (dropdown && dropdown.classList.contains('show-menu')) {
        dropdown.classList.remove('show-menu');
      }
    }
  </script>

</body>
</html>
