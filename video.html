<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexZa - YouTube Style Video Platform</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', 'Segoe UI', Arial, sans-serif; }
    body { 
      background: #0f0f0f url("./brean.png") no-repeat center center fixed;
      background-size: cover;
      color: #f1f1f1; 
      overflow-x: hidden; 
    }

    /* SPLASH SCREEN */
    #splash-screen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #0a0000; z-index: 9999;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      transition: opacity 0.6s ease, visibility 0.6s;
    }
    
    .splash-img-container {
      width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center; background: #ffffff;
    }
    .splash-img-container img { max-width: 80%; max-height: 80%; object-fit: contain; }
    .splash-logo { animation: zoomPulse 2s infinite alternate ease-in-out; }
    @keyframes zoomPulse {
      0% { transform: scale(0.9); filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.4)); }
      100% { transform: scale(1.02); filter: drop-shadow(0 0 25px rgba(139, 92, 246, 0.8)); }
    }
    .loader-line { width: 140px; height: 3px; background: #eee; margin-top: 25px; border-radius: 3px; overflow: hidden; }
    .loader-progress { width: 0%; height: 100%; background: linear-gradient(90deg, #00F0FF, #8B5CF6); animation: load 2s forwards; }
    @keyframes load { 100% { width: 100%; } }

    /* HEADER */
    header {
      position: sticky; top: 0; z-index: 100; background: rgba(15, 15, 15, 0.98);
      backdrop-filter: blur(8px);
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 12px; height: 56px; border-bottom: 1px solid #222; gap: 8px;
    }
    .header-left { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .menu-icon { font-size: 22px; cursor: pointer; color: #fff; padding: 4px; display: flex; align-items: center; justify-content: center; }
    .logo-svg { width: 110px; height: 32px; cursor: pointer; }

    .search-container { display: flex; align-items: center; width: 100%; max-width: 500px; }
    .search-container input {
      width: 100%; padding: 7px 14px; background: #121212; border: 1px solid #303030;
      border-radius: 40px 0 0 40px; color: #fff; outline: none; font-size: 14px;
    }
    .search-container button {
      padding: 7px 14px; background: #222222; border: 1px solid #303030; border-left: none;
      border-radius: 0 40px 40px 0; cursor: pointer; color: #fff; flex-shrink: 0;
    }

    .header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .dev-btn { background: #222; color: #888; border: 1px solid #333; padding: 5px 9px; border-radius: 18px; font-size: 11px; cursor: pointer; }
    .dev-btn.active { color: #00ff66; border-color: #00ff66; }
    .create-btn { background: #272727; color: #fff; border: 1px solid #3f3f3f; padding: 5px 10px; border-radius: 18px; cursor: pointer; font-weight: 500; font-size: 13px; display: none; align-items: center; gap: 4px; white-space: nowrap; }
    .signin-btn { border: 1px solid #3ea6ff; color: #3ea6ff; background: transparent; padding: 5px 10px; border-radius: 18px; cursor: pointer; font-weight: 500; font-size: 13px; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
    .user-profile { background: #8B5CF6; color: #fff; font-weight: bold; width: 32px; height: 32px; border-radius: 50%; display: none; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; }

    /* LAYOUT FIXED FOR STICKY STUFF */
    .app-layout { display: flex; min-height: calc(100vh - 56px); }
    .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 200; display: none; }
    
    aside {
      width: 230px; background: rgba(15, 15, 15, 0.95); padding: 12px; display: flex; flex-direction: column; gap: 4px;
      flex-shrink: 0; border-right: 1px solid #1f1f1f; transition: transform 0.3s ease; z-index: 201;
      height: calc(100vh - 56px); position: sticky; top: 56px;
    }
    aside a { display: flex; align-items: center; gap: 20px; padding: 10px 12px; color: #f1f1f1; text-decoration: none; font-size: 14px; border-radius: 10px; transition: 0.2s; }
    aside a:hover, aside a.active { background: #272727; font-weight: 500; }
    aside hr { border: 0; border-top: 1px solid #272727; margin: 8px 0; }

    main { flex: 1; padding: 16px; width: 100%; }

    .category-tags { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .category-tags::-webkit-scrollbar { display: none; }
    .tag { background: rgba(39, 39, 39, 0.8); padding: 6px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .tag.active { background: #fff; color: #000; font-weight: 600; }

    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
    .video-card { position: relative; cursor: pointer; border-radius: 12px; padding: 6px; transition: background 0.2s; }
    .video-card:hover { background-color: rgba(48, 1, 1, 0.8); }

    .thumbnail-box {
      width: 100%; aspect-ratio: 16/9; background: #1f1f1f; border-radius: 12px;
      position: relative; overflow: hidden; margin-bottom: 10px;
      background-size: cover; background-position: center;
      display: flex; align-items: center; justify-content: center;
    }
    .thumbnail-box::after { content: '▶'; font-size: 24px; color: rgba(255,255,255,0.85); }
    .duration { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.8); padding: 2px 6px; font-size: 11px; border-radius: 4px; font-weight: 500; color: #fff; }

    .video-details { display: flex; gap: 12px; position: relative; }
    .channel-avatar { width: 36px; height: 36px; background: #333; border-radius: 50%; flex-shrink: 0; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:14px; }
    .video-meta { flex: 1; min-width: 0; }
    
    /* 3 LINE TITLE PERFECT FIX */
    .video-meta h3 { 
      font-size: 15px; 
      font-weight: 600; 
      line-height: 1.3em; 
      max-height: 3.9em; /* Exact height for 3 lines */
      margin-bottom: 4px; 
      color: #f1f1f1; 
      display: -webkit-box; 
      -webkit-line-clamp: 3; 
      -webkit-box-orient: vertical; 
      overflow: hidden; 
      text-overflow: ellipsis;
      word-break: break-word;
    }
    .video-meta p { font-size: 13px; color: #aaa; }

    .dev-delete-btn { background: transparent; border: none; color: #ff4d4d; font-size: 16px; cursor: pointer; padding: 4px 8px; border-radius: 4px; transition: 0.2s; align-self: flex-start; display: none; }
    .dev-delete-btn:hover { background: rgba(255, 77, 77, 0.2); }
    body.is-developer .dev-delete-btn { display: block; }

    /* WATCH VIEW FIXES */
    #watchView { display: none; gap: 20px; width: 100%; max-width: 1200px; margin: 0 auto; }
    .watch-main { flex: 1; min-width: 0; }
    
    .video-player-container { 
      width: 100%; 
      aspect-ratio: 16/9; 
      background: #000; 
      border-radius: 12px; 
      overflow: hidden; 
      margin-bottom: 12px; 
    }
    .video-player-container iframe { width: 100%; height: 100%; border: none; }
    .watch-title { font-size: 17px; font-weight: bold; margin-bottom: 10px; line-height: 1.3; }
    .watch-actions { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 12px; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
    .channel-info { display: flex; align-items: center; gap: 10px; }
    .sub-btn { background: #fff; color: #000; border: none; padding: 6px 14px; border-radius: 18px; font-weight: bold; cursor: pointer; font-size: 13px; }
    .action-btns { display: flex; gap: 6px; }
    .act-btn { background: #272727; color: #fff; border: none; padding: 6px 12px; border-radius: 18px; font-size: 13px; cursor: pointer; }

    .watch-sidebar { width: 360px; flex-shrink: 0; display: flex; flex-direction: column; gap: 16px; }

    .modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 1000; display: none; justify-content: center; align-items: center; padding: 15px; }
    .modal-box { background: #212121; padding: 20px; border-radius: 14px; width: 100%; max-width: 420px; position: relative; }
    .modal-box h2 { margin-bottom: 12px; color: #fff; font-size: 18px; }
    .modal-box input { width: 100%; padding: 10px; margin-bottom: 10px; background: #121212; border: 1px solid #3f3f3f; border-radius: 6px; color: #fff; outline: none; font-size: 14px; }
    .modal-box button { width: 100%; padding: 10px; background: #3ea6ff; color: #000; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .close-modal { position: absolute; top: 12px; right: 15px; font-size: 22px; cursor: pointer; color: #aaa; }

    /* MOBILE SPECIFIC OVERRIDES */
    @media (max-width: 850px) {
      aside { position: fixed; top: 0; left: 0; height: 100vh; transform: translateX(-100%); box-shadow: 4px 0 15px rgba(0,0,0,0.5); }
      aside.open { transform: translateX(0); }
      .sidebar-overlay.active { display: block; }
      .search-container { max-width: 180px; }
      .search-container input { padding: 5px 10px; font-size: 12px; }
      .search-container button { padding: 5px 10px; }
      .signin-btn { padding: 4px 8px; font-size: 12px; }
      .logo-svg { width: 90px; height: 28px; }
      main { padding: 0 0 16px 0; }
      #homeView { padding: 8px; }
      .video-grid { grid-template-columns: 1fr; }
      #watchView { flex-direction: column; gap: 12px; }
      .watch-sidebar { width: 100%; padding: 0 12px; }
      .watch-title, .watch-actions { padding-left: 12px; padding-right: 12px; }

      /* ABSOLUTE MOBILE FIXED VIDEO PLAYER */
      .video-player-container {
        position: -webkit-sticky;
        position: sticky;
        top: 56px; /* Below Header */
        z-index: 150;
        border-radius: 0;
        margin-bottom: 12px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      }
    }
  </style>
</head>
<body>

  <!-- SPLASH SCREEN -->
  <div id="splash-screen">
    <div class="splash-img-container">
      <div class="splash-logo">
        <svg width="260" height="75" viewBox="0 0 320 95" fill="none">
          <defs>
            <linearGradient id="zG" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#00F0FF"/><stop offset="100%" stop-color="#8B5CF6"/>
            </linearGradient>
          </defs>
          <rect x="5" y="5" width="80" height="80" rx="22" fill="#0F111A" stroke="url(#zG)" stroke-width="2.5"/>
          <path d="M 26 26 L 64 26 L 34 64 L 64 64" stroke="url(#zG)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
          <polygon points="50,38 62,45 50,52" fill="#FFB800"/>
          <text x="100" y="52" fill="#000000" font-size="40" font-weight="900">Nex<tspan fill="#00F0FF">Za</tspan></text>
          <text x="102" y="72" fill="#FFB800" font-size="10" font-weight="800" letter-spacing="3">BY STZ IT COM</text>
        </svg>
      </div>
    </div>
    <div class="loader-line"><div class="loader-progress"></div></div>
  </div>

  <!-- HEADER -->
  <header>
    <div class="header-left">
      <span class="menu-icon" onclick="toggleSidebar()">☰</span>
      <svg class="logo-svg" viewBox="0 0 300 90" fill="none" onclick="showHomeView()">
        <rect x="5" y="5" width="75" height="75" rx="20" fill="#0F111A" stroke="#00F0FF" stroke-width="2"/>
        <path d="M 24 24 L 60 24 L 32 60 L 60 60" stroke="#00F0FF" stroke-width="8" stroke-linecap="round"/>
        <polygon points="48,35 60,42 48,49" fill="#FFB800"/>
        <text x="95" y="50" fill="#FFF" font-size="38" font-weight="900">Nex<tspan fill="#00F0FF">Za</tspan></text>
      </svg>
    </div>

    <div class="search-container">
      <input type="text" placeholder="Search...">
      <button>🔍</button>
    </div>

    <div class="header-right">
      <button class="dev-btn" id="devToggleBtn" onclick="toggleDeveloperAccess()">🔑 Dev Mode</button>
      <button class="create-btn" id="uploadBtn" onclick="openUploadModal()">➕ <span>Create</span></button>
      <button class="signin-btn" id="signinBtn" onclick="openLoginModal()">👤 <span>Sign In</span></button>
      <div class="user-profile" id="userAvatar" onclick="alert('Channel Profile Active!')">U</div>
    </div>
  </header>

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <!-- MAIN LAYOUT -->
  <div class="app-layout">
    <aside id="mainSidebar">
      <a href="javascript:void(0)" onclick="showHomeView(); toggleSidebar();" class="active">🏠 Home</a>
      <a href="#">⚡ Shorts</a>
      <a href="#">📺 Subscriptions</a>
      <hr>
      <a href="#">📁 Library</a>
      <a href="#">📜 History</a>
      <a href="#">💻 Your Channel</a>
      <a href="#">⏱️ Watch Later</a>
      <hr>
      <a href="#">⚙️ Settings</a>
    </aside>

    <main>
      <div id="homeView">
        <div class="category-tags">
          <div class="tag active">All</div>
          <div class="tag">Computer Science</div>
          <div class="tag">JavaScript</div>
          <div class="tag">Python</div>
          <div class="tag">Web Development</div>
        </div>

        <div class="video-grid" id="videoGrid"></div>
      </div>

      <div id="watchView">
        <div class="watch-main">
          <div class="video-player-container">
            <iframe id="mainPlayer" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
          </div>
          <h1 class="watch-title" id="watchTitle">Video Title Here</h1>
          
          <div class="watch-actions">
            <div class="channel-info">
              <div class="channel-avatar" id="watchAvatar" style="background:#8B5CF6;">S</div>
              <div>
                <strong id="watchChannel" style="color:#fff; display:block; font-size:14px;">Channel Name</strong>
                <span style="color:#aaa; font-size:11px;">100K subscribers</span>
              </div>
              <button class="sub-btn">Subscribe</button>
            </div>

            <div class="action-btns">
              <button class="act-btn">👍 12K</button>
              <button class="act-btn">➡️ Share</button>
              <button class="act-btn">💾 Save</button>
            </div>
          </div>
        </div>

        <div class="watch-sidebar" id="watchSidebar"></div>
      </div>
    </main>
  </div>

  <!-- LOGIN MODAL -->
  <div id="loginModal" class="modal">
    <div class="modal-box">
      <span class="close-modal" onclick="closeModal('loginModal')">&times;</span>
      <h2>Sign In / Create Channel</h2>
      <input type="text" id="usernameInput" placeholder="Enter Channel/User Name...">
      <input type="email" id="emailInput" placeholder="Enter Email Address...">
      <button onclick="handleLogin()">Sign In & Activate Channel</button>
    </div>
  </div>

  <!-- UPLOAD MODAL -->
  <div id="uploadModal" class="modal">
    <div class="modal-box">
      <span class="close-modal" onclick="closeModal('uploadModal')">&times;</span>
      <h2>Upload New Video (Public)</h2>
      <input type="text" id="videoTitleInput" placeholder="Video Title...">
      <input type="text" id="youtubeIdInput" placeholder="YouTube Link or Video ID...">
      <input type="text" id="durationInput" placeholder="Duration (e.g. 10:45)...">
      <button onclick="handlePublishVideo()">Publish Video Publicly</button>
    </div>
  </div>

  <script>
    const DEVELOPER_SECRET_KEY = "admin123";
    let isDeveloperLoggedIn = false;
    let currentUser = null;

    const defaultVideos = [
      { indexId: 1, id: 'dQw4w9WgXcQ', title: 'Full HTML & CSS Crash Course for Beginners 2026 - Learn Web Development Step by Step Guide', channel: 'STZ Academy', views: '120K views', duration: '15:24' },
      { indexId: 2, id: 'L_LUpnjgPso', title: 'How to become a CSE Engineer in Bangladesh - Full Guidelines, Roadmaps and Salary Details', channel: 'NexZa Tech', views: '85K views', duration: '28:10' }
    ];

    let videos = JSON.parse(localStorage.getItem('nexza_videos')) || defaultVideos;

    window.addEventListener('DOMContentLoaded', () => {
      renderHomeGrid();
      
      const savedUser = localStorage.getItem('nexza_user_name');
      if (savedUser) {
        currentUser = savedUser;
        activateUserUI(savedUser);
      }

      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        splash.style.opacity = '0';
        setTimeout(() => splash.style.visibility = 'hidden', 600);
      }, 1500);
    });

    function toggleSidebar() {
      const sidebar = document.getElementById('mainSidebar');
      const overlay = document.getElementById('sidebarOverlay');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('active');
    }

    function createVideoCardHTML(v) {
      return `
        <div class="video-card">
          <div class="thumbnail-box" style="background-image: url('https://img.youtube.com/vi/${v.id}/hqdefault.jpg');" onclick="loadWatchViewByUniqueId(${v.indexId})">
            <span class="duration">${v.duration}</span>
          </div>
          <div class="video-details">
            <div class="channel-avatar" onclick="loadWatchViewByUniqueId(${v.indexId})">${v.channel.charAt(0)}</div>
            <div class="video-meta" onclick="loadWatchViewByUniqueId(${v.indexId})">
              <h3>${v.title}</h3>
              <p>${v.channel} • ${v.views}</p>
            </div>
            <button class="dev-delete-btn" title="Delete Video (Developer Only)" onclick="deleteVideoAsDev(${v.indexId})">🗑️</button>
          </div>
        </div>
      `;
    }

    function renderHomeGrid() {
      const grid = document.getElementById('videoGrid');
      grid.innerHTML = videos.map(v => createVideoCardHTML(v)).join('');
    }

    function toggleDeveloperAccess() {
      if (!isDeveloperLoggedIn) {
        const pass = prompt("Enter Developer Secret Password:");
        if (pass === DEVELOPER_SECRET_KEY) {
          isDeveloperLoggedIn = true;
          document.body.classList.add('is-developer');
          document.getElementById('devToggleBtn').innerText = "🔑 Dev Mode: ON";
          document.getElementById('devToggleBtn').classList.add('active');
          alert("Developer Controls Activated!");
        } else {
          alert("Wrong Password! Access Denied.");
        }
      } else {
        isDeveloperLoggedIn = false;
        document.body.classList.remove('is-developer');
        document.getElementById('devToggleBtn').innerText = "🔑 Dev Mode";
        document.getElementById('devToggleBtn').classList.remove('active');
      }
    }

    function deleteVideoAsDev(uniqueId) {
      if (!isDeveloperLoggedIn) return;

      const targetVideo = videos.find(v => v.indexId === uniqueId);
      if (!targetVideo) return;

      if (confirm(`Developer Action: Confirm deletion of "${targetVideo.title}"?`)) {
        videos = videos.filter(v => v.indexId !== uniqueId);
        localStorage.setItem('nexza_videos', JSON.stringify(videos));
        renderHomeGrid();
        alert('Video removed successfully by Developer.');
      }
    }

    function showHomeView() {
      document.getElementById('watchView').style.display = 'none';
      document.getElementById('homeView').style.display = 'block';
      document.getElementById('mainPlayer').src = '';
    }

    function loadWatchViewByUniqueId(uniqueId) {
      const video = videos.find(v => v.indexId === uniqueId);
      if (video) loadWatchView(video);
    }

    function loadWatchView(video) {
      document.getElementById('homeView').style.display = 'none';
      document.getElementById('watchView').style.display = 'flex';

      document.getElementById('mainPlayer').src = `https://www.youtube.com/embed/${video.id}?autoplay=1`;
      document.getElementById('watchTitle').innerText = video.title;
      document.getElementById('watchChannel').innerText = video.channel;
      document.getElementById('watchAvatar').innerText = video.channel.charAt(0);

      const sidebar = document.getElementById('watchSidebar');
      const otherVideos = videos.filter(v => v.indexId !== video.indexId);
      sidebar.innerHTML = otherVideos.map(v => createVideoCardHTML(v)).join('');

      window.scrollTo(0,0);
    }

    function openLoginModal() { document.getElementById('loginModal').style.display = 'flex'; }
    function openUploadModal() { document.getElementById('uploadModal').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function handleLogin() {
      const name = document.getElementById('usernameInput').value;
      const email = document.getElementById('emailInput').value;

      if (!name) return alert('Please enter your channel name!');

      currentUser = name;
      localStorage.setItem('nexza_user_name', name);
      if (email) localStorage.setItem('nexza_user_email', email);

      activateUserUI(name);
      closeModal('loginModal');
      alert(`Welcome, ${name}! Your channel is now active.`);
    }

    function activateUserUI(name) {
      document.getElementById('signinBtn').style.display = 'none';
      document.getElementById('uploadBtn').style.display = 'flex';
      
      const avatar = document.getElementById('userAvatar');
      avatar.innerText = name.charAt(0).toUpperCase();
      avatar.style.display = 'flex';
    }

    function extractYouTubeID(urlOrId) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = urlOrId.trim().match(regExp);
      return (match && match[2].length === 11) ? match[2] : urlOrId.trim();
    }

    function handlePublishVideo() {
      const title = document.getElementById('videoTitleInput').value;
      const rawInput = document.getElementById('youtubeIdInput').value;
      const duration = document.getElementById('durationInput').value || '05:00';

      if (!title || !rawInput) return alert('Please enter video title and YouTube link/ID!');

      const ytId = extractYouTubeID(rawInput);

      const newVideo = {
        indexId: Date.now(),
        id: ytId,
        title: title,
        channel: currentUser || 'Anonymous Channel',
        views: '1 view',
        duration: duration
      };

      videos.unshift(newVideo);
      localStorage.setItem('nexza_videos', JSON.stringify(videos));

      renderHomeGrid();
      closeModal('uploadModal');
      
      document.getElementById('videoTitleInput').value = '';
      document.getElementById('youtubeIdInput').value = '';
      document.getElementById('durationInput').value = '';
      
      alert('Video Published Successfully!');
    }
  </script>
</body>
</html>
