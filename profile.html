<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile Setup</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #0c141a;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    /* ৩ লাইন বাটন এবং ড্রপডাউন মেনু সিএসএস (Fixed Issues) */
    .hamburger-dropdown {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 2000;
    }

    .hamburger-btn {
      background: #111b21;
      border: 1px solid #dee94b;
      color: #dee94b;
      font-size: 22px;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .dropdown-content {
      display: none; /* ডিফল্টভাবে হাইড থাকবে */
      position: absolute;
      top: 45px;
      left: 0;
      background-color: #111b21;
      min-width: 200px;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.8);
      border: 1px solid #222d34;
      border-radius: 8px;
      overflow: hidden;
    }

    .dropdown-content.show {
      display: block; /* ক্লিক করলে শো করবে */
    }

    .dropdown-content a {
      color: #e9edef;
      padding: 10px 15px;
      text-decoration: none;
      display: block;
      font-size: 14px;
      border-bottom: 1px solid #1f2c34;
    }

    .dropdown-content a:hover {
      background-color: #202c33;
      color: #dee94b;
    }

    /* প্রোফাইল বক্স সিএসএস */
    .profile-box {
      background: rgba(30, 30, 30, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 25px;
      max-width: 450px;
      margin: 60px auto 30px auto;
      color: white;
    }

    .profile-img-preview {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #dee94b;
      margin: 0 auto 15px auto;
      display: block;
      box-shadow: 0 0 10px rgba(222, 233, 75, 0.5);
    }

    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .input-group label {
      display: block;
      margin-bottom: 5px;
      color: #dee94b;
    }

    .input-group input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #555;
      background: #111;
      color: white;
      box-sizing: border-box;
    }

    .btn {
      background: #dee94b;
      color: black;
      font-weight: bold;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }

    .btn:hover {
      background: #ffea00;
    }

    .profile-info p {
      border-bottom: 1px solid #444;
      padding: 8px 0;
      margin: 5px 0;
      text-align: left;
    }
  </style>
</head>
<body>

  <!-- Hamburger Dropdown (Top Left Corner) -->
  <div class="hamburger-dropdown">
    <button class="hamburger-btn" onclick="toggleMenu(event)">☰</button>
    <div class="dropdown-content" id="myDropdown">
      <a href="./index.html">🏠 Home</a>
      <a href="./profile.html">👤 My Profile</a>
      <a href="./NOTICE.html" target="_blank">📢 Notice</a>
      <a href="./chat.html" target="_blank">👥 ChatVerse</a>
      <a href="./download.html">⬇️ Download</a>
      <a href="">📄 Assignment</a>
      <a href="./complain.html" target="_blank">📝 Complain Box</a>
      <a href="./HELP-LINE.html" target="_blank">☎️ Helpline</a>
      <a href="./feedback.html" target="_blank">💬 Feedback</a>
      <a href="">⚙️ Setting</a>
      <a href="./about.html">ℹ️ About Us</a>
      <a href="">🚪 Log Out</a>
    </div>
  </div>

  <div class="main-container">
    <div class="profile-box">
      <h2 style="color: #dee94b; text-align: center;">🎓 Student Profile</h2>

      <!-- ১. ফর্ম: তথ্য পূরণ -->
      <form id="profileForm" onsubmit="saveProfile(event)">
        
        <div class="input-group">
          <label>Profile Picture:</label>
          <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
        </div>

        <div class="input-group">
          <label>Student Name:</label>
          <input type="text" id="name" required placeholder="আপনার নাম লিখুন">
        </div>

        <div class="input-group">
          <label>ID:</label>
          <input type="text" id="roll" required placeholder="আপনার আইডি নম্বর">
        </div>

        <div class="input-group">
          <label>Department & Batch:</label>
          <input type="text" id="batch" required placeholder="উদাহরণ: CSE-27">
        </div>

        <div class="input-group">
          <label>Phone / WhatsApp:</label>
          <input type="text" id="phone" required placeholder="মোবাইল নম্বর">
        </div>

        <div class="input-group">
          <label>Home District:</label>
          <input type="text" id="district" required placeholder="নিজ জেলার নাম">
        </div>

        <div class="input-group">
          <label>Present Address</label>
          <input type="text" id="address" required placeholder="বর্তমান ঠিকানা">
        </div>

        <button type="submit" class="btn">Save Profile</button>
      </form>

      <!-- ২. সেভ হওয়া প্রোফাইল ভিউ -->
      <div id="profileView" style="display: none;" class="profile-info">
        <img id="viewImg" src="" alt="Student Photo" class="profile-img-preview">
        
        <p><strong>Name:</strong> <span id="viewName"></span></p>
        <p><strong>Roll/ID:</strong> <span id="viewRoll"></span></p>
        <p><strong>Batch:</strong> <span id="viewBatch"></span></p>
        <p><strong>Phone:</strong> <span id="viewPhone"></span></p>
        <p><strong>District:</strong> <span id="viewDistrict"></span></p>
        <p><strong>Address:</strong> <span id="viewAddress"></span></p>
        
        <button onclick="editProfile()" class="btn" style="background: #ff9900;">Edit Profile</button>
      </div>

      <div style="text-align: center; margin-top: 15px;">
        <a href="./index.html" style="color: #ffcc00; text-decoration: none;">🏠 Back to Home</a>
      </div>
    </div>
  </div>

  <script>
    // ৩ লাইনের ডেমো মেনু ওপেন/ক্লোজ করার ফাংশন
    function toggleMenu(event) {
      event.stopPropagation();
      document.getElementById("myDropdown").classList.toggle("show");
    }

    // মেনুর বাইরে কোথাও ক্লিক করলে মেনুটি বন্ধ হয়ে যাবে
    window.onclick = function(event) {
      if (!event.target.matches('.hamburger-btn')) {
        const dropdowns = document.getElementsByClassName("dropdown-content");
        for (let i = 0; i < dropdowns.length; i++) {
          let openDropdown = dropdowns[i];
          if (openDropdown.classList.contains('show')) {
            openDropdown.classList.remove('show');
          }
        }
      }
    }

    let base64Image = "";

    function previewImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          base64Image = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function saveProfile(e) {
      e.preventDefault();
      
      const studentData = {
        image: base64Image || (localStorage.getItem('studentProfile') ? JSON.parse(localStorage.getItem('studentProfile')).image : ''),
        name: document.getElementById('name').value,
        roll: document.getElementById('roll').value,
        batch: document.getElementById('batch').value,
        phone: document.getElementById('phone').value,
        district: document.getElementById('district').value,
        address: document.getElementById('address').value
      };

      localStorage.setItem('studentProfile', JSON.stringify(studentData));
      showProfile();
    }

    function showProfile() {
      const savedData = localStorage.getItem('studentProfile');
      if (savedData) {
        const data = JSON.parse(savedData);
        
        document.getElementById('viewImg').src = data.image || 'https://api.dicebear.com/7.x/bottts/svg?seed=student';
        document.getElementById('viewName').innerText = data.name || '';
        document.getElementById('viewRoll').innerText = data.roll || '';
        document.getElementById('viewBatch').innerText = data.batch || '';
        document.getElementById('viewPhone').innerText = data.phone || '';
        document.getElementById('viewDistrict').innerText = data.district || '';
        document.getElementById('viewAddress').innerText = data.address || '';

        document.getElementById('profileForm').style.display = 'none';
        document.getElementById('profileView').style.display = 'block';
      }
    }

    function editProfile() {
      const savedData = localStorage.getItem('studentProfile');
      if (savedData) {
        const data = JSON.parse(savedData);
        document.getElementById('name').value = data.name || '';
        document.getElementById('roll').value = data.roll || '';
        document.getElementById('batch').value = data.batch || '';
        document.getElementById('phone').value = data.phone || '';
        document.getElementById('district').value = data.district || '';
        document.getElementById('address').value = data.address || '';
        base64Image = data.image || '';
      }
      document.getElementById('profileForm').style.display = 'block';
      document.getElementById('profileView').style.display = 'none';
    }

    showProfile();
  </script>

</body>
</html>
